version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: exelix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: EXELIX
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 20050617in
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - exelix-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: exelix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - exelix-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exelix-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:20050617in@postgres:5432/EXELIX}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_BASE_URL: ${API_BASE_URL:-https://exelix.ru}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://exelix.ru}
      FRONTEND_URL: ${FRONTEND_URL:-https://exelix.ru}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://exelix.ru/api/v1/auth/google/callback}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-exelix.service@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-20050617Exelix!}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BMtQbKRgvzh3MuF3V1TJAPJ79kJp279W4_Dn1fCoelpAF4rEIJXYGNBC9e0j4r9nLJzWitplpuboFe3Vj2BwL9g}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-dN4Ir-XI_DXgfxrOva6eFLsUDNFJKkzzQjDSmAo12nE}
      VAPID_EMAIL: ${VAPID_EMAIL:-exelix.service@gmail.com}
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - redis
    networks:
      - exelix-network
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend (Vite React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exelix-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      VITE_API_URL: https://exelix.ru/api
    depends_on:
      - backend
    networks:
      - exelix-network

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: exelix-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - exelix-network

volumes:
  postgres_data:
  redis_data:

networks:
  exelix-network:
    driver: bridge
